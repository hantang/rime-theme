# https://gist.github.com/ThinkCats/59b4d1f33bd0e06b177007a13054fcb2
# 对 purity_of_form 略微调整颜色，让色彩更柔和点，补全其他选项和注释
patch:
  "preset_color_schemes/purity_of_day":
    name: "純粹的形式／Purity of Form Custom"
    author: 雨過之後、佛振

    color_space: srgb                       # 色彩空间： srgb | display_p3
    back_color: 0xECECEC
    candidate_text_color: 0xD8000000
    comment_text_color: 0x3F000000
    label_color: 0xE54F4F4F
    hilited_candidate_back_color: 0xEF6C3D
    hilited_candidate_text_color: 0xD8FFFFFF
    hilited_comment_text_color: 0x3F000000

    #font_face: ""                   # 字体及大小
    #font_point: 17
    #label_font_face: "Helvetica"    # 序号字体及大小
    #label_font_point: 12
    #comment_font_face: "Helvetica"  # 注字体及大小
    #comment_font_point: 17
    # candidate_list_layout: linear  # 候选排布：层叠 stacked | 行 linear
    # text_orientation: horizontal    # 行文向： 横 horizontal | 纵 vertical
    # inline_preedit: true            # 拼音位于： 候选框 false | 行内 true
    # translucency: false             # 磨砂： false | true
    # mutual_exclusive: false         # 色不叠加： false | true
    # border_height: 0               # 外边框 高
    # corner_radius: 5              # 外边框 圆角半径
    # hilited_corner_radius: 0       # 选中框 圆角半径
    # surrounding_extra_expansion: 0 # 候选项背景相对大小？
    # shadow_size: 2                 # 阴影大小
    # line_spacing: 10                # 行间距
    # base_offset: 1                 # 字基高
    # alpha: 1                       # 透明度，0~1
    # spacing: 15                    # 拼音与候选项之间的距离 （inline_preedit: false）
