patch:
  "preset_color_schemes/Lumk_dark":
    name: "鹿鸣／Lumk dark / Mac深色"
    author: "Lumk X <x@xx.cc>"

    back_color: 0x252A2E
    border_color: 0x050505
    candidate_text_color: 0xE9E9EA
    comment_text_color: 0x999999
    hilited_back_color: 0xD75A00
    hilited_candidate_label_color: 0xFFFFFF
    hilited_candidate_text_color: 0xFFFFFF
    hilited_comment_text_color: 0x999999
    hilited_text_color: 0x999999
    label_color: 0x999999
    text_color: 0x424242
    shadow_color: 0x808080

    # border_height: 4                             # 窗口上下高度，大于圆角半径才生效
    # border_width: 4                              # 窗口左右宽度，大于圆角半径才生效
    # candidate_format: "%c %@ "                   # 用 1/6 em 空格 U+2005 来控制编号 %c 和候选词 %@ 前后的空间
    # candidate_list_layout: linear                # linear-候选词水平排列/stacked-垂直排列（1.0.0之后生效）
    # corner_radius: 5                             # 窗口圆角
    # dborder_width: 4                             # 设置输入条左右宽度
    # font_face: "PingFangSC"                      # 候选词字体
    # font_point: 16                               # 候选字大小
    # hilited_corner_radius: 5                     # 高亮圆角
    # horizontal: true                             # true横排，false竖排
    # inline_preedit: true                         # 设置是否双行显示
    # label_font_point: 13                         # 候选编号大小
    # line_spacing: 10                             # 行间距(适用于竖排)
    # text_orientation: horizontal                 # 设置每个词的文字排列方向 horizontal-水平/vertical-垂直（1.0.0之后生效）
